<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <h1>Escola Virtual</h1>
    <h2>Formulário de Pré Matrícula</h2>
</head>
<body>
    <fieldset>
        <b>Dados Pessoais:</b>
        Nome do Aluno: <input type="text" name="nomealuno">
        Nascimento (dd/mm/aa): <input type="text" name="nascimento">
        Nome da Mãe: <input type="text" name="nomemae">
        Nome do Pai: <input type="text" name="nomepai">
        Telefone: DDD(<input type="text" name="ddd">) Tel <input type="text" name="telefone"> Ramal <input type="text" name="ramal">
    </fieldset>
    <fieldset>
        <b>Informações de Matrícula</b>
        Série: <select name="serie">
                    <option value="fund">Ensino Fundamental</option>
                    <option value="medio">Ensino Médio</option>
                </select>
        Turno: <input type="radio" name="turno">Manhã 
                <input type="radio" name="turno">Tarde 
        Atividades Extracurriculares: 
                <input type="checkbox" name="informatica">Informática
                <input type="checkbox" name="musica">Música
                <input type="checkbox" name="basquete">Basquete
    </fieldset>
</body>
</html>
